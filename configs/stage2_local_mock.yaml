project:
  name: radioml-amc-stage2
  seed: 42

data:
  mode: mock
  dataset: mock_radioml
  num_samples: 128
  num_classes: 4
  snr_values: [-6, 0, 6, 12]
  signal_length: 128
  test_size: 0.2
  val_size: 0.1
  split_strategy: stratified

features:
  views: ["iq", "stft", "cwt"]
  stft:
    nperseg: 32
    noverlap: 16
    log_scale: true
    normalize: true
  cwt:
    num_scales: 8
    min_scale: 1.0
    max_scale: 24.0
    log_scale: true
    normalize: true

train:
  model: fusion_iq_stft_cwt
  epochs: 1
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 0
  device: auto
  early_stopping_patience: 1

outputs:
  run_root: runs
  save_checkpoint: true
  save_plots: true
  save_report: true
