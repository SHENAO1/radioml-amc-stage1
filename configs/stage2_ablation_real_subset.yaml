project:
  name: radioml-amc-stage2
  seed: 42

data:
  mode: real
  dataset: RML2016.10A
  raw_path: auto
  test_size: 0.2
  val_size: 0.1
  split_strategy: stratified_by_mod_snr
  subset_mode: true
  subset_mods: ["BPSK", "QPSK", "8PSK", "QAM16"]
  subset_snrs: [-2, 0, 2, 4, 6, 8, 10, 12]
  max_samples_per_group: 200

features:
  amp_phase:
    normalize: true
  stft:
    nperseg: 32
    noverlap: 16
    log_scale: true
    normalize: true
  cwt:
    num_scales: 8
    min_scale: 1.0
    max_scale: 24.0
    log_scale: true
    normalize: true

train:
  model: tfcnn_stft
  epochs: 5
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 0
  device: auto
  early_stopping_patience: 5

ablation:
  models:
    - tfcnn_stft
    - tfcnn_cwt
    - fusion_iq_stft
    - fusion_iq_amp_phase
    - fusion_iq_stft_cwt
  output_dir: runs/stage2_1_real_subset_stage2_only

outputs:
  run_root: runs
  save_checkpoint: true
  save_plots: true
  save_report: true
