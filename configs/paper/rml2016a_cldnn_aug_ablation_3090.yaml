# Ablation: CLDNN (I/Q only) + signal-domain augmentation + label smoothing.
#
# Purpose: isolate whether the accuracy gain from augmentation requires the
# fusion architecture (fusion_cldnn_stft) or transfers equally to the simpler
# CLDNN baseline.  If CLDNN+aug matches fusion_cldnn_stft+aug, the fusion
# architecture contributes no additional value beyond being a carrier for
# augmentation.  If CLDNN+aug lags behind, the fusion has a specific
# amplification effect on augmentation.
#
# Same fixed split, 3 seeds, extended-budget schedule, and augmentation /
# label-smoothing hyperparameters as the fusion_cldnn_stft_aug_ls_3090
# experiment, so results are directly comparable.

execution:
  stage: paper_stage6_cldnn_aug_ablation
  evidence_status: in_progress
  evidence_label: CLDNN_AUG_ABLATION_3090
  guardrails:
    - Do not write into results/paper_stage6/extended_budget_3090/ or fusion_cldnn_stft_aug_ls_3090/.
    - Use the same fixed split artifact as all Stage 6 experiments.

experiment:
  dataset_id: rml2016a
  dataset_name: RML2016.10A
  split_id: stratified_by_mod_snr_seed42
  split_artifact_npz: data/splits/rml2016a/stratified_by_mod_snr_seed42.npz
  split_summary_json: data/splits/rml2016a/stratified_by_mod_snr_seed42_summary.json
  split_seed: 42
  train_seeds:
    - 42
    - 2025
    - 3407
  models:
    - cldnn

data:
  mode: real
  dataset: RML2016.10A
  raw_path: auto
  subset_mode: false
  subset_mods: null
  subset_snrs: null
  max_samples_per_group: null
  split_strategy: stratified_by_mod_snr
  split_artifact_npz: data/splits/rml2016a/stratified_by_mod_snr_seed42.npz
  split_summary_json: data/splits/rml2016a/stratified_by_mod_snr_seed42_summary.json
  test_size: 0.2
  val_size: 0.1

features:
  stft:
    nperseg: 32
    noverlap: 16
    log_scale: true
    normalize: true

train:
  epochs: 50
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 4
  device: auto
  early_stopping_patience: 15
  scheduler:
    name: cosine
    warmup_epochs: 5
  loss:
    name: ce
    label_smoothing: 0.1
  augmentation:
    enabled: true
    phase_rotation_prob: 0.5
    time_shift_prob: 0.5
    time_shift_max: 8

outputs:
  result_root: results/paper_stage6/cldnn_aug_ablation_3090/rml2016a
  per_run_shape: results/paper_stage6/cldnn_aug_ablation_3090/rml2016a/<model_id>/seed_<train_seed>
  aggregate_dir: results/paper_stage6/cldnn_aug_ablation_3090/rml2016a/aggregate
  save_checkpoint: true
  save_plots: true
  save_report: true
  required_files:
    - config_resolved.yaml
    - metrics_test.json
    - metrics_per_snr.csv
    - metrics_per_class.csv
    - predictions_test.csv
    - confusion_overall.csv
    - confusion_low_snr.csv
    - complexity.json
    - latency.json
    - training_summary.json
